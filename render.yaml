services:
  - type: web
    name: wx-ai
    runtime: python
    plan: free
    region: singapore
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 1 --threads 4 -b 0.0.0.0:$PORT app:app
    healthCheckPath: /health
    envVars:
      - key: WX_TOKEN
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: SELF_NICKNAME
        value: 米思子
      - key: PYTHON_VERSION
        value: 3.12.7
